{% extends "layout.html" %}
{% block title %}Tests: Home{% endblock %}

{% block body %}
<style>
    /* Question Block Card */
    .question-block {
        background-color: #fdfefe;
        border: 1px solid #e1e8ed;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 25px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .question-block:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .question-block h3 {
        margin-top: 0;
        color: #34495e;
        font-size: 18px;
    }

    /* Make Radio Options Look Like Clean Blocks */
    .option-label {
        display: block;
        padding: 12px 15px;
        margin: 8px 0;
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .option-label:hover {
        background: #eef2f7;
        border-color: #cbd5e1;
    }

    /* Highlight the selected option slightly */
    .option-label input[type="radio"]:checked+span {
        font-weight: bold;
        color: #2563eb;
    }
</style>
<form action="/submit" method="POST">
    {% for q in questions %}
    <div class="question-block">
        <h3>Question {{ loop.index }}: {{ q.question }}</h3>

        <!-- Pass the exact question text to your python backend hidden from view -->
        <input type="hidden" name="question_text_{{ loop.index }}" value="{{ q.question }}">

        <!-- Group options cleanly using the loop counter number (q1, q2, etc) -->
        <label><input type="radio" name="answer_{{ loop.index }}" value="A" required> A) {{ q.option_a }}</label><br>
        <label><input type="radio" name="answer_{{ loop.index }}" value="B"> B) {{ q.option_b }}</label><br>
        <label><input type="radio" name="answer_{{ loop.index }}" value="C"> C) {{ q.option_c }}</label><br>
        <label><input type="radio" name="answer_{{ loop.index }}" value="D"> D) {{ q.option_d }}</label><br>
    </div>
    <hr>
    {% endfor %}
    <button type="submit">Submit Quiz</button>
</form>
{% endblock %}
